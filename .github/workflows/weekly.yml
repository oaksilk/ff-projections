name: Weekly rankings

on:
  # Each Eastern-time slot in ffmodel/config.py SCHEDULE_ET appears twice: at its
  # daylight-time (UTC-4) and standard-time (UTC-5) offset. scripts/gate.py lets
  # only the right one through. Keep in sync with SCHEDULE_ET.
  schedule:
    - cron: "0 14 * * 2"     # Tue 10:00 ET
    - cron: "0 15 * * 2"
    - cron: "0 13 * * 0"     # Sun 9:00 ET
    - cron: "0 14 * * 0"
    - cron: "45 15 * * 0"    # Sun 11:45 ET (Vegas props)
    - cron: "45 16 * * 0"
    - cron: "0 19 * * 0"     # Sun 3:00 ET
    - cron: "0 20 * * 0"
    - cron: "5 23 * * *"     # nightly 7:05 ET
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      props:
        description: "Fetch Vegas props (spends Odds API credits unless pulled in the last 3 hours)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Schedule gate
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_PROPS: ${{ inputs.props }}
        run: python3 scripts/gate.py | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Build rankings
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CACHE_HOURS: "0"
        run: |
          if [ "${{ steps.gate.outputs.props }}" = "true" ]; then
            python scripts/run_weekly.py --props
          else
            python scripts/run_weekly.py
          fi
      - name: Save history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add site/data data/props
          git diff --cached --quiet || git commit -m "Rankings update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
