name: Weekly rankings

on:
  # A cheap gate check fires twice an hour at unpopular minutes (config.CHECK_MINUTES;
  # GitHub delays top-of-the-hour crons the most). scripts/gate.py builds when a slot in
  # config.SCHEDULE_ET has passed and hasn't been served yet (so late or dropped firings
  # catch up), or, between slots, when ESPN injury statuses changed. Off-season it exits.
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      props:
        description: "Fetch Vegas props (spends Odds API credits unless pulled in the last 8 hours)"
        type: boolean
        default: false
      snapshot:
        description: "Also save a frozen evaluation snapshot (never overwrites an existing one)"
        type: choice
        options: [none, fri, sun]
        default: none

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Schedule gate
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_PROPS: ${{ inputs.props }}
          MANUAL_SNAPSHOT: ${{ inputs.snapshot }}
        run: python3 scripts/gate.py | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Build rankings
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CACHE_HOURS: "0"
          PROPS: ${{ steps.gate.outputs.props }}
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
          SLOT: ${{ steps.gate.outputs.slot }}
        run: |
          args=()
          [ "$PROPS" = "true" ] && args+=(--props)
          [ -n "$SNAPSHOT" ] && args+=(--snapshot "$SNAPSHOT")
          python scripts/run_weekly.py "${args[@]}"
      - name: Save history
        if: steps.gate.outputs.run == 'true'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
          INJURY_HASH: ${{ steps.gate.outputs.injury_hash }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          python3 scripts/gate.py --record
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add site/data data/props data/archive data/run_state.json snapshots
          git diff --cached --quiet || git commit -m "Rankings update $(date -u +%F) ($REASON)"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Score any finished week that has snapshots but no report, then email the report to the
  # repo owner as a GitHub issue. Runs on every in-season slot, so a missed Tuesday heals
  # itself on the next run. Separate job so a failure here never blocks the rankings deploy.
  evaluate:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        run: python3 scripts/evaluate.py --pending | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.pending == 'true'
        run: pip install -r requirements.txt
      - name: Score finished weeks
        if: steps.check.outputs.pending == 'true'
        run: python scripts/evaluate.py
      - name: Save reports and email them
        if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -s reports/live/.new ] || { echo "no week ready yet"; exit 0; }
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add reports/live
          git commit -m "Weekly evaluation report"
          git pull --rebase
          git push
          while read -r f; do
            gh issue create --title "$(head -1 "$f" | sed 's/^# //')" --body-file "$f" --assignee "$OWNER"
          done < reports/live/.new
